{% extends "base.html" %}{% block content %}<section class="container section"><h1>Поиск по сайту</h1><form><input class="field" name="q" value="{{ q }}" placeholder="Введите запрос"><button class="btn">Найти</button></form><div class="grid">{% for r in results %}<div class="card"><h3>{{ r[2] }}</h3><p>{{ r[3][:220] }}...</p>{% if r[0] %}<a class="btn" href="{{ url_for('article', item_id=r[0]) }}">Открыть</a>{% endif %}</div>{% else %}<p>Введите запрос или уточните формулировку.</p>{% endfor %}</div></section>{% endblock %}
