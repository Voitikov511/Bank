{% extends "base.html" %}{% block content %}<section class="container section"><h1>Статьи</h1><p>В каждом разделе размещено не менее пяти материалов.</p><div class="nav">{% for key,name in categories.items() %}<a class="badge" href="{{ url_for('category', category=key) }}">{{ name }}</a>{% endfor %}</div><div class="grid">{% for cat,title,text in articles %}<div class="card"><span class="badge">{{ categories[cat] }}</span><h3>{{ title }}</h3><p>{{ text[:150] }}...</p><a class="btn" href="{{ url_for('article', item_id=loop.index if not active else (loop.index + (0 if active=='cards' else 5 if active=='credits' else 10 if active=='deposits' else 15))) }}">Читать</a></div>{% endfor %}</div></section>{% endblock %}
